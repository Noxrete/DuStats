<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DuStats — Placar</title>
<link rel="stylesheet" href="/shared/tema.css">
<style>
  /*
   * Placar permanente. Fica no ar durante o jogo e sai sozinho quando o painel
   * entra em INTERVALO ou RESUMO — o operador não precisa mexer no OBS.
   */
  /* Placar e barra de posse ficam no mesmo container em coluna, para a barra
     acompanhar a largura do placar sozinha, sem número mágico no CSS. */
  #canto {
    position: absolute; top: 46px; left: 60px;
    display: inline-flex; flex-direction: column; align-items: stretch; gap: 6px;
  }

  #placar {
    display: flex; align-items: stretch;
    border-radius: 8px; overflow: hidden;
    box-shadow: var(--sombra);
    opacity: 0; transform: translateX(-40px);
    transition: opacity 420ms ease, transform 520ms cubic-bezier(.22,1,.36,1);
  }
  #placar.no-ar { opacity: 1; transform: none; }

  .lado { display: flex; align-items: center; gap: 14px; padding: 0 22px; background: var(--painel); }
  .lado .escudo {
    width: 46px; height: 46px; object-fit: contain;
    display: grid; place-items: center;
    font-size: 15px; font-weight: 700; border-radius: 5px; letter-spacing: .02em;
  }
  .lado .sigla { font-size: 30px; font-weight: 700; letter-spacing: .04em; min-width: 76px; }
  .lado.fora { flex-direction: row-reverse; }
  .lado.fora .sigla { text-align: right; }

  .faixa { width: 8px; }
  .faixa.casa { background: var(--cor-casa); }
  .faixa.fora { background: var(--cor-fora); }

  .gols {
    display: flex; align-items: center; gap: 18px;
    padding: 0 26px; background: var(--painel-claro);
    font-size: 40px; font-weight: 700; line-height: 1;
  }
  .gols .tracinho { opacity: .35; font-size: 26px; }

  .tempo {
    display: grid; place-items: center; gap: 2px;
    padding: 12px 24px; min-width: 148px;
    background: var(--preto);
  }
  .tempo .cronometro { font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -.01em; }
  .tempo .periodo { font-size: 12px; letter-spacing: .18em; color: var(--texto-fraco); text-transform: uppercase; }
  .tempo.parado .cronometro { animation: pulsar 2.4s ease-in-out infinite; }

  .acrescimo {
    display: grid; place-items: center; padding: 0 16px;
    background: var(--amarelo); color: #241d00;
    font-size: 26px; font-weight: 700;
  }
  .acrescimo[hidden] { display: none !important; }

  /* Barra de posse: fininha, embaixo do placar, sem número — quem quiser o
     número vê no intervalo. No ar ela serve como sensação, não como dado. */
  #posse {
    height: 7px; border-radius: 999px; overflow: hidden;
    background: rgba(0, 0, 0, .6);
    opacity: 0; transition: opacity 420ms ease;
  }
  #posse.no-ar { opacity: 1; }
  #posse.escondido { opacity: 0 !important; }
</style>
</head>
<body class="overlay">

<div id="canto">
<div id="placar">
  <div class="faixa casa"></div>
  <div class="lado casa">
    <span id="escudoCasa"></span>
    <span class="sigla" id="siglaCasa">CAS</span>
  </div>
  <div class="gols num">
    <span id="golsCasa">0</span><span class="tracinho">×</span><span id="golsFora">0</span>
  </div>
  <div class="lado fora">
    <span id="escudoFora"></span>
    <span class="sigla" id="siglaFora">VIS</span>
  </div>
  <div class="faixa fora"></div>
  <div class="tempo" id="tempo">
    <span class="cronometro num" id="cronometro">00:00</span>
    <span class="periodo" id="periodo">1º Tempo</span>
  </div>
  <div class="acrescimo num" id="acrescimo" hidden>+0</div>
</div>

<div id="posse" class="trilho">
  <span class="casa" style="width:50%"></span>
  <span class="fora" style="width:50%"></span>
</div>
</div>

<script src="/shared/bus.js"></script>
<script src="/shared/relogio.js"></script>
<script src="/shared/overlay.js"></script>
<script>
'use strict';

const canto = document.getElementById('canto');
const placar = document.getElementById('placar');
const barraPosse = document.getElementById('posse');
const { overlay } = DuStats;

DuStats.overlay.aoModo('jogo', placar);
DuStats.overlay.aoModo('jogo', barraPosse);

// ?posse=0 tira a barra; ?pos=... muda o canto (para quem tem o logo da
// transmissão ocupando o lado esquerdo).
if (overlay.parametros.get('posse') === '0') barraPosse.classList.add('escondido');

const CANTOS = {
  tl: { top: '46px', left: '60px', right: 'auto', bottom: 'auto' },
  tr: { top: '46px', right: '60px', left: 'auto', bottom: 'auto' },
  bl: { bottom: '110px', left: '60px', right: 'auto', top: 'auto' },
  br: { bottom: '110px', right: '60px', left: 'auto', top: 'auto' }
};
const posicao = CANTOS[overlay.parametros.get('pos')];
if (posicao) Object.assign(canto.style, posicao);

DuStats.aoEstado((estado) => {
  document.getElementById('siglaCasa').textContent = overlay.sigla(estado.config, 'casa');
  document.getElementById('siglaFora').textContent = overlay.sigla(estado.config, 'fora');
  document.getElementById('escudoCasa').innerHTML = overlay.escudo(estado.config, 'casa', { substituto: false });
  document.getElementById('escudoFora').innerHTML = overlay.escudo(estado.config, 'fora', { substituto: false });
  document.getElementById('golsCasa').textContent = estado.placar.casa;
  document.getElementById('golsFora').textContent = estado.placar.fora;
  document.getElementById('periodo').textContent = estado.relogio.periodoNome;

  document.getElementById('tempo').classList.toggle('parado', !estado.relogio.rodando);

  const acrescimo = document.getElementById('acrescimo');
  acrescimo.hidden = !estado.relogio.acrescimoMin;
  acrescimo.textContent = `+${estado.relogio.acrescimoMin}`;

  barraPosse.querySelector('.casa').style.width = `${estado.posse.casa}%`;
  barraPosse.querySelector('.fora').style.width = `${estado.posse.fora}%`;
});

DuStats.relogio.aoTique((texto) => {
  document.getElementById('cronometro').textContent = texto;
});
</script>
</body>
</html>
