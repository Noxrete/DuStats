<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>DuStats — Resumo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/shared/tema.css">
<link rel="stylesheet" href="/shared/paineis.css">
<link rel="stylesheet" href="/shared/skins.css">
<style>
  /* Barra de exportação: só aparece com ?exportar=1, ou seja, quando a página
     foi aberta num navegador comum. No OBS a URL vai sem o parâmetro e o
     overlay fica limpo. */
  #exportar {
    position: fixed; inset: auto 0 0; z-index: 50;
    display: none; align-items: center; justify-content: center; gap: 14px;
    padding: 18px; background: rgba(5, 7, 11, .96);
    border-top: 1px solid var(--linha);
  }
  body.com-exportacao { cursor: auto; }
  body.com-exportacao #exportar { display: flex; }
  #exportar button, #exportar a {
    font-family: inherit; font-size: 15px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; text-decoration: none;
    color: #fff; background: #1b2432; border: 1px solid var(--linha);
    border-radius: 6px; padding: 13px 22px; cursor: pointer;
  }
  #exportar button:hover, #exportar a:hover { filter: brightness(1.4); }
  #exportar button:disabled { opacity: .5; cursor: wait; }
  #erroExportar { color: #ffcc55; font-size: 14px; max-width: 280px; }
  #previa { max-height: 150px; border-radius: 6px; border: 1px solid var(--linha); }
</style>
</head>
<body class="overlay">

<div class="cena-painel" id="painel">
  <div class="painel-cheio">
    <div data-cabecalho></div>
    <div class="corpo">
      <div class="slide"></div>
      <div class="slide"></div>
      <div class="slide"></div>
      <div class="slide"></div>
    </div>
    <div class="pontinhos" data-pontinhos><i></i><i></i><i></i><i></i></div>
  </div>
</div>

<div id="exportar">
  <img id="previa" alt="Prévia do card" hidden>
  <span id="erroExportar" role="status" hidden></span>
  <button id="btPng" disabled>Baixar PNG quadrado</button>
  <a href="/api/export/resumo.csv">Resumo CSV</a>
  <a href="/api/export/eventos.csv">Lances CSV</a>
  <a href="/api/export/partida.json">Backup JSON</a>
</div>

<script src="/shared/bus.js"></script>
<script src="/shared/relogio.js"></script>
<script src="/shared/campo.js"></script>
<script src="/shared/overlay.js"></script>
<script src="/shared/paineis.js"></script>
<script src="/shared/carrossel.js"></script>
<script src="/shared/cartao.js"></script>
<script>
'use strict';

const exportando = DuStats.overlay.parametros.get('exportar') === '1';
DuStats.carrossel.iniciar({
  modo: 'resumo',
  painel: document.getElementById('painel'),
  titulo: () => 'Fim de jogo',
  sempreVisivel: exportando
});

if (exportando) {
  document.body.classList.add('com-exportacao');
  let assinatura = null;
  let geracao = 0;
  let baixando = false;
  const erro = document.getElementById('erroExportar');
  const previa = document.getElementById('previa');
  const botao = document.getElementById('btPng');

  DuStats.aoEstado(async (estado) => {
    botao.disabled = baixando;
    const atual = JSON.stringify([estado.id, estado.config, estado.placar,
      estado.comparativo, estado.linhaDoTempo, estado.criadaEm]);
    if (atual === assinatura) return;
    assinatura = atual;
    const minhaGeracao = ++geracao;
    previa.hidden = true;
    erro.hidden = true;
    try {
      const canvas = await DuStats.cartao.desenhar(estado, { titulo: 'Fim de jogo' });
      if (minhaGeracao !== geracao) return;
      previa.src = canvas.toDataURL('image/png');
      previa.hidden = false;
    } catch {
      if (minhaGeracao !== geracao) return;
      assinatura = null;
      erro.textContent = 'Não foi possível gerar a prévia. Confira os escudos e tente novamente.';
      erro.hidden = false;
    }
  });

  botao.addEventListener('click', async () => {
    const estado = DuStats.estado();
    if (!estado || baixando) return;
    baixando = true;
    botao.disabled = true;
    erro.hidden = true;
    try { await DuStats.cartao.baixar(estado, { titulo: 'Fim de jogo' }); }
    catch {
      erro.textContent = 'Não foi possível baixar o PNG. Confira os escudos e tente novamente.';
      erro.hidden = false;
    } finally { baixando = false; botao.disabled = false; }
  });
}

</script>
</body>
</html>
